<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4dce5">
<title>для тебя ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rose:#f2cbd7;--rose-deep:#d99caf;--cream:#fff7f7;--plum:#765466;--text:#755767;--muted:#a98d9b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font-family:Manrope,Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,#fffafd 0%,#fcecf1 42%,#f4dce5 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(2px 2px at 8% 18%,#fff 99%,transparent),radial-gradient(2px 2px at 75% 13%,#e6b8c8 99%,transparent),radial-gradient(1.5px 1.5px at 45% 42%,#fff 99%,transparent),radial-gradient(2px 2px at 90% 60%,#fff 99%,transparent),radial-gradient(2px 2px at 22% 74%,#e9bdce 99%,transparent),radial-gradient(1.5px 1.5px at 62% 83%,#fff 99%,transparent);background-size:290px 250px,360px 300px,420px 350px,310px 280px,390px 330px,460px 390px;z-index:-1}
.wrap{width:min(1450px,calc(100% - 64px));margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9aebd66;color:#9a7184}
.brand{font:italic 25px 'Cormorant Garamond',serif;letter-spacing:1px}.brand span{color:#d49aaf}
nav a{color:#9c7889;text-decoration:none;text-transform:uppercase;font-size:10px;letter-spacing:2px;margin-left:25px}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.hero{display:grid;grid-template-columns:.9fr 1.35fr;gap:38px;align-items:center;padding:55px 0 30px}
.copy{padding-left:5%;position:relative;z-index:2}
.kicker{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#c18b9f}
h1{font:italic 500 clamp(48px,5vw,76px)/.98 'Cormorant Garamond',serif;margin:22px 0 28px;color:#bd8299;text-shadow:0 2px 25px #e8b8ca66}
.compliments{list-style:none;padding:0;margin:0 0 30px;color:#886779;font:500 21px/1.75 'Cormorant Garamond',serif;letter-spacing:.3px}
.compliments li:before{content:"♡";color:#d99caf;margin-right:13px;font-family:serif}
.heart-button{position:relative;display:inline-flex;align-items:center;gap:11px;padding:13px 34px;border:1px solid #dfaabd;border-radius:50px;background:linear-gradient(135deg,#fff9fa,#f8e3ea);color:#9b6d82;font:500 19px 'Cormorant Garamond',serif;cursor:pointer;transition:.25s;box-shadow:0 8px 25px #d99caf35}
.heart-button:hover{background:#f7dce6;box-shadow:0 0 35px #d99caf66;transform:translateY(-2px)}
.heart-button .heart{font-size:22px;color:#d98fa8}
.photo-stage{height:475px;position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate}
.moon{position:absolute;top:-30px;left:43%;width:145px;height:145px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fffdf7,#f9e5d9 35%,#edcbd5 68%,#dbaabd 100%);box-shadow:0 0 35px #f5d9e6,0 0 110px #e8b7ca88;opacity:.95;z-index:-1}
.moon:after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(ellipse at 30% 40%,#d9b5bf33 0 8%,transparent 9%),radial-gradient(ellipse at 65% 65%,#d9b5bf33 0 12%,transparent 13%),radial-gradient(ellipse at 55% 25%,#fff8 0 6%,transparent 7%)}
.photo{position:absolute;background:#fffafa;padding:9px 9px 25px;border:1px solid #e9c4d0;box-shadow:0 16px 45px #b9859b35;transition:transform .35s,filter .35s;cursor:pointer}
.photo img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.88) sepia(.06) brightness(1.04)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#fff5f8aa,transparent 50%,#dbaabd18);pointer-events:none}
.photo.left{width:31%;height:310px;left:3%;top:92px;transform:rotate(-4deg);z-index:1}
.photo.center{width:39%;height:405px;left:31%;top:12px;transform:rotate(1deg);z-index:3}
.photo.right{width:30%;height:315px;right:2%;top:100px;transform:rotate(4deg);z-index:2}
.photo.fourth{width:18%;height:180px;right:5%;bottom:0;transform:rotate(-5deg);z-index:4;opacity:.98}
.tape{position:absolute;top:-12px;left:34%;width:34%;height:22px;background:#f0d0daaa;transform:rotate(-3deg);z-index:5;opacity:.85}
.photo:hover{filter:brightness(1.04);z-index:6;transform:translateY(-8px) rotate(0)}
.bottom{padding:20px 0 35px;display:flex;justify-content:center}
.player{width:min(610px,100%);padding:18px 22px 16px;border:1px solid #e8c5d1;border-radius:22px;background:linear-gradient(180deg,#fffafbdc,#f9e8eedb);backdrop-filter:blur(8px);box-shadow:0 12px 35px #d7a9ba35}
.track-title{text-align:center;font:italic 20px 'Cormorant Garamond',serif;color:#a9768d;margin-bottom:13px}
.controls{display:flex;align-items:center;justify-content:center;gap:28px}
.control{border:0;background:none;color:#b27e95;font-size:19px;cursor:pointer;padding:6px}
.control.main{width:44px;height:44px;border:1px solid #dfaabd;border-radius:50%;font-size:17px;background:#fff6f8}
.control:hover{color:#86576f}
.timeline{display:flex;align-items:center;gap:12px;margin-top:12px;color:#a17c8d;font-size:11px;font-variant-numeric:tabular-nums}
input[type=range]{appearance:none;height:3px;background:#e4bdcb;outline:none;flex:1;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:9px;height:9px;border-radius:50%;background:#d997ad;box-shadow:0 0 8px #e4b6c7}
.volume{width:75px;flex:none}
.hint{text-align:center;color:#b08e9d;font-size:10px;letter-spacing:1px;margin-top:10px}
.float-heart{position:fixed;bottom:22%;left:50%;pointer-events:none;z-index:20;color:#e49ab4;font-size:24px;text-shadow:0 0 14px #f1c3d3;animation:floatUp 2.4s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-75vh) scale(1.5) rotate(var(--rot))}}
@media(max-width:850px){.wrap{width:min(100% - 32px,620px)}.hero{grid-template-columns:1fr;gap:12px;padding:42px 0 10px}.copy{text-align:center;padding:0}.compliments{font-size:19px}.photo-stage{height:390px}.moon{width:105px;height:105px;top:0}.photo.left{height:245px;top:90px}.photo.center{height:330px;top:30px}.photo.right{height:250px;top:100px}.photo.fourth{height:140px}.bottom{padding-top:12px}header{height:62px}}
@media(max-width:480px){.wrap{width:calc(100% - 24px)}nav a{margin-left:10px;font-size:9px}.brand{font-size:21px}h1{font-size:49px;margin:15px 0 18px}.compliments{font-size:18px;line-height:1.6;margin-bottom:22px}.photo-stage{height:300px}.photo.left{height:190px;top:75px}.photo.center{height:260px;top:15px}.photo.right{height:195px;top:80px}.photo.fourth{height:110px}.moon{width:82px;height:82px;top:-5px}.player{padding:14px 10px}.controls{gap:22px}.volume{width:54px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">little <span>moon</span> ♡</div><nav><a href="#photos">наши моменты</a><a href="#music">для настроения</a></nav></header>
<main>
<section class="hero">
<div class="copy">
<div class="kicker">a little note for you ✧</div>
<h1>Ты невероятно<br>красивая ♡</h1>
<ul class="compliments">
<li>Добрая и искренняя</li>
<li>Нежная и заботливая</li>
<li>Умная и интересная</li>
<li>Просто особенная ♥</li>
</ul>
<button class="heart-button" id="heartBtn"><span>♡</span> Нажми и <span class="heart">♥</span></button>
</div>
<div class="photo-stage" id="photos">
<div class="moon"></div>
<div class="photo left"><img src="images/photo2.jpeg" alt="Фото"><div class="tape"></div></div>
<div class="photo center"><img src="images/photo1.jpeg" alt="Фото"><div class="tape"></div></div>
<div class="photo right"><img src="images/photo3.jpeg" alt="Фото"></div>
<div class="photo fourth"><img src="images/photo4.jpeg" alt="Фото"></div>
</div>
</section>
</main>
<section class="bottom" id="music">
<div class="player">
<div class="track-title">♪ а ты пахнешь цветами</div>
<audio id="audio" preload="metadata" src="music/тёмный%20принц%20-%20цветы.mp3"></audio>
<div class="controls">
<button class="control" id="restart" aria-label="С начала">↶</button>
<button class="control main" id="play" aria-label="Воспроизвести">▶</button>
<button class="control" id="end" aria-label="В конец">↷</button>
</div>
<div class="timeline"><span id="current">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span><span>♫</span><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Громкость"></div>
<div class="hint" id="status">включи звук и побудь здесь немного ♡</div>
</div>
</section>
</div>
<script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),current=document.getElementById('current'),duration=document.getElementById('duration'),status=document.getElementById('status');
const fmt=t=>{if(!Number.isFinite(t))return'0:00';return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();play.textContent='Ⅱ';status.textContent='♪ играет для тебя'}catch(e){status.textContent='Добавь файл music/our-song.mp3 в репозиторий ♡'}}else{audio.pause();play.textContent='▶';status.textContent='пауза ♡'}});
audio.addEventListener('loadedmetadata',()=>duration.textContent=fmt(audio.duration));
audio.addEventListener('timeupdate',()=>{current.textContent=fmt(audio.currentTime);if(audio.duration)seek.value=audio.currentTime/audio.duration*100});
audio.addEventListener('ended',()=>{play.textContent='▶';status.textContent='ещё раз? ♡'});
seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});
document.getElementById('volume').addEventListener('input',e=>audio.volume=Number(e.target.value));
document.getElementById('restart').addEventListener('click',()=>{audio.currentTime=0;});
document.getElementById('end').addEventListener('click',()=>{if(audio.duration)audio.currentTime=Math.max(0,audio.duration-1)});
document.getElementById('heartBtn').addEventListener('click',()=>{for(let i=0;i<24;i++){const h=document.createElement('span');h.className='float-heart';h.textContent=Math.random()>.35?'♥':'♡';h.style.left=(15+Math.random()*70)+'%';h.style.setProperty('--dx',(Math.random()*220-110)+'px');h.style.setProperty('--rot',(Math.random()*90-45)+'deg');h.style.animationDelay=(Math.random()*.65)+'s';h.style.fontSize=(16+Math.random()*24)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),3300)}});
document.querySelectorAll('.photo').forEach(el=>el.addEventListener('click',()=>{el.style.zIndex=8;setTimeout(()=>el.style.zIndex='',700)}));
</script>
</body></html>
