<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f5">
<title>little moon ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');
:root{--bg:#e9e7e5;--ink:#37343a;--muted:#969098;--pink:#e9e5e8;--line:#eae7e4;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:radial-gradient(#aaa2a8 .55px,transparent .55px);background-size:10px 10px;z-index:-1}
.wrap{width:min(1060px,calc(100% - 36px));margin:auto}
nav{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font:600 23px 'Playfair Display',serif;letter-spacing:.4px}.logo span{color:#a99eaa}
nav a{font-size:12px;color:var(--muted);text-decoration:none;margin-left:24px;letter-spacing:1px;text-transform:uppercase}
.hero{padding:72px 0 48px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#9d929d}
h1{font:500 clamp(42px,6vw,70px)/1.04 'Playfair Display',serif;margin:17px 0 18px;letter-spacing:-1.7px}
h1 em{color:#a99eaa;font-weight:500}
.intro{max-width:420px;color:#89848a;font-size:14px;line-height:1.9}
.hero-photo{height:390px;position:relative;padding:12px;background:#f3f1ef;box-shadow:0 18px 48px #24212614;transform:rotate(1deg)}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 35%;filter:saturate(.58) contrast(.97)}
.sticker{position:absolute;bottom:-20px;left:-26px;background:#efedeb;border-radius:50%;width:76px;height:76px;display:grid;place-items:center;color:#8d858d;font:italic 14px 'Playfair Display',serif;transform:rotate(-12deg);text-align:center}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:30px 0 22px}
h2{font:500 34px 'Playfair Display',serif;margin:0}.section-head p{font-size:11px;letter-spacing:1.5px;color:#9c969b;text-transform:uppercase}
.gallery{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.tile{background:#f2f0ee;padding:9px 9px 15px;box-shadow:0 7px 24px #38323808;cursor:pointer;transition:.25s}
.tile:nth-child(2){transform:translateY(24px)}.tile:nth-child(3){transform:translateY(8px)}
.tile:hover{transform:translateY(-5px) rotate(0);box-shadow:0 12px 30px #38323810}
.tile img{display:block;width:100%;height:310px;object-fit:cover;filter:saturate(.58) contrast(.98)}
.tile:nth-child(1) img{object-position:center 30%}.tile:nth-child(2) img{object-position:center 28%}.tile:nth-child(3) img{object-position:center 35%}
.tile small{display:block;text-align:center;padding-top:12px;color:#918990;font:italic 14px 'Playfair Display',serif}
.note{display:none}
.note:before,.note:after{display:none}
.note h2{font-size:29px}.note p{color:#827887;font-size:13px;line-height:1.8;margin:12px auto 0;max-width:470px}
footer{border-top:1px solid var(--line);padding:25px 0 32px;display:flex;justify-content:space-between;color:#a19a9e;font-size:11px;letter-spacing:1px}
.lightbox{position:fixed;inset:0;background:#17131bdc;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
.lightbox.open{display:flex}.lightbox img{max-width:min(90vw,800px);max-height:88vh;object-fit:contain;box-shadow:0 20px 80px #0008}
.close{position:absolute;right:24px;top:18px;color:#fff;font-size:30px;cursor:pointer;background:none;border:0}
@media(max-width:700px){nav{height:64px}nav a{margin-left:12px;font-size:10px}.hero{grid-template-columns:1fr;gap:30px;padding:48px 0 30px}.hero-photo{height:340px;width:88%;margin:0 auto}.gallery{grid-template-columns:1fr 1fr;gap:12px}.tile img{height:250px}.tile:nth-child(2),.tile:nth-child(3){transform:none}.tile:nth-child(3){grid-column:1/-1;width:70%;justify-self:center}.note{margin:60px 0 38px}footer{font-size:9px}}
@media(max-width:390px){.gallery{grid-template-columns:1fr}.tile:nth-child(3){grid-column:auto;width:100%}.tile img{height:330px}}
</style>
</head>
<body>
<div class="wrap">
<nav><div class="logo">little <span>moon</span> ♡</div><div><a href="#gallery">gallery</a></div></nav>
<main>
<section class="hero">
<div><div class="eyebrow">a little collection ♡</div><h1>little moments,<br><em>softly kept.</em></h1><p class="intro">Немного фотографий, красивых деталей и тихого настроения.</p></div>
<div class="hero-photo"><img src="images/photo1.jpeg" alt="Фото из личной галереи"><div class="sticker">♡</div></div>
</section>
<section id="gallery">
<div class="section-head"><h2>little memories</h2><p>01 — 04 / photos</p></div>
<div class="gallery">
<div class="tile" data-photo="images/photo2.jpeg"><img src="images/photo2.jpeg" alt="Портрет"><small>soft light</small></div>
<div class="tile" data-photo="images/photo3.jpeg"><img src="images/photo3.jpeg" alt="Портрет"><small>a quiet moment</small></div>
<div class="tile" data-photo="images/photo4.jpeg"><img src="images/photo4.jpeg" alt="Портрет"><small>favorite frame</small></div>
</div>
</section>

</main>
<footer><span>made with ♡</span><span>a little gallery · made with care</span></footer>
</div>
<div class="lightbox" id="lightbox"><button class="close" aria-label="Закрыть">×</button><img src="" alt="Увеличенное фото"></div>
<script>
const box=document.getElementById('lightbox'), big=box.querySelector('img');
document.querySelectorAll('.tile').forEach(tile=>tile.addEventListener('click',()=>{big.src=tile.dataset.photo;box.classList.add('open')}));
box.addEventListener('click',e=>{if(e.target===box||e.target.classList.contains('close'))box.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')box.classList.remove('open')});
</script>
</body></html>
